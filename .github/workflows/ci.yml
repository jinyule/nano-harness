name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  static:
    name: Static and architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - name: Verify source, modules, architecture, skills, and reference pin
        env:
          AGENT_NOTE_BASE_REF: ${{ github.event.pull_request.base.sha }}
          AGENT_NOTE_EXEMPT: ${{ contains(github.event.pull_request.labels.*.name, 'agent-note-exempt') && '1' || '' }}
          AGENT_NOTE_EXEMPT_REASON: maintainer applied the agent-note-exempt label
        run: make fmt-check mod-check vet architecture submodule agent-notes skills workflow-tools

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up the lint-supported Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: ./...

  test:
    name: Go ${{ matrix.go }} / race tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Test with the selected toolchain only
        run: go test -race -count=1 ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - name: Enforce product coverage floor
        run: make coverage

  build:
    name: Build / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - name: Build and run the real entry point
        shell: bash
        run: make build

  security:
    name: Reachable vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - name: Run the pinned govulncheck client
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  release-dry-run:
    name: Release dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean --skip=publish
      - name: Prepare the exact publication payload
        run: scripts/prepare-release.sh dist release-artifacts
      - name: Verify payload and smoke the packaged binary
        run: scripts/smoke-release.sh release-artifacts

  all-checks-passed:
    name: All checks passed
    if: always()
    runs-on: ubuntu-latest
    needs: [static, lint, test, coverage, build, security, release-dry-run]
    steps:
      - name: Fail closed on every required job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [[ "$result" != success ]]; then
              echo "required job result: $result" >&2
              exit 1
            fi
          done
          echo "All required jobs succeeded: $RESULTS"
